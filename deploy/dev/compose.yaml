name: talenro-dev

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: talenro
      POSTGRES_USER: talenro
      POSTGRES_PASSWORD: talenro_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talenro -d talenro"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

  redis:
    image: redis:8.8.1-alpine3.23
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - redis-data:/data

  nats:
    image: nats:2.14.3-alpine3.22
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data

  mirror-a:
    image: golang:1.26.5-alpine3.23
    working_dir: /workspace
    command: ["go", "run", "./cmd/bundle-mirror"]
    environment:
      TALENRO_DATABASE_URL: postgres://talenro:talenro_dev@postgres:5432/talenro?sslmode=disable
      TALENRO_HTTP_ADDRESS: 0.0.0.0:8081
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace:ro

  mirror-b:
    image: golang:1.26.5-alpine3.23
    working_dir: /workspace
    command: ["go", "run", "./cmd/bundle-mirror"]
    environment:
      TALENRO_DATABASE_URL: postgres://talenro:talenro_dev@postgres:5432/talenro?sslmode=disable
      TALENRO_HTTP_ADDRESS: 0.0.0.0:8082
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace:ro

volumes:
  postgres-data:
  redis-data:
  nats-data:
