      content: {application/json: {schema: {$ref: "#/components/schemas/FailureDomainV1"}}}
    FailureDomainList:
      description: Failure domain page
      content: {application/json: {schema: {$ref: "#/components/schemas/FailureDomainListV1"}}}
    NodeCreated:
      description: Node created
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeV1"}}}
    Node:
      description: Node
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeV1"}}}
    NodeList:
      description: Node page
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeListV1"}}}
    NodeEndpointCreated:
      description: Node endpoint created
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeEndpointV1"}}}
    NodeEndpoint:
      description: Node endpoint
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeEndpointV1"}}}
    NodeEndpointList:
      description: Node endpoint page
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeEndpointListV1"}}}
    NodeProcessSlotCreated:
      description: Node process slot created
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeProcessSlotV1"}}}
    NodeProcessSlot:
      description: Node process slot
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeProcessSlotV1"}}}
    NodeProcessSlotList:
      description: Node process slot page
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodeProcessSlotListV1"}}}
    EnrollmentGrant:
      description: Enrollment grant metadata and first-response secret
