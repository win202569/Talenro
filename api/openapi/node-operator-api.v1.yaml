    SigningOperation:
      description: Durable node state signing operation
      content: {application/json: {schema: {$ref: "#/components/schemas/SigningOperationV1"}}}
    RecoveryOperation:
      description: Durable node recovery operation
      content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryOperationV1"}}}
    RecoveryEnrollmentGrant:
      description: Recovery-bound enrollment grant
      content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryEnrollmentGrantV1"}}}
    ResourceEnvelopeActivation:
