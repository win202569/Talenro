      type: object
      additionalProperties: false
      required: [grant_id, node_id, csr_der_sha256, expires_at, result]
      properties:
        grant_id: {$ref: "#/components/schemas/CanonicalUUID"}
        node_id: {$ref: "#/components/schemas/CanonicalUUID"}
        csr_der_sha256: {$ref: "#/components/schemas/DigestHex32"}
        expires_at: {type: string, format: date-time}
        result: {$ref: "#/components/schemas/OperationResultV1"}
        enrollment_grant: {$ref: "#/components/schemas/Base64URL32"}
    DesiredProcessV1:
      type: object
      additionalProperties: false
      required: [slot_id, adapter, release_id, required, lifecycle, test_profile, capacity_profile_id, capacity_profile_version, required_metrics, probe_profile, restart_profile]
      properties:
        slot_id: {$ref: "#/components/schemas/SlotIDV1"}
        adapter: {$ref: "#/components/schemas/AdapterV1"}
        release_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
        required: {type: boolean}
        lifecycle: {$ref: "#/components/schemas/ProcessLifecycleV1"}
        test_profile: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
        capacity_profile_id: {$ref: "#/components/schemas/CapacityProfileIDV1"}
        capacity_profile_version: {$ref: "#/components/schemas/PositiveInt64"}
        required_metrics:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            enum: [cpu_basis_points, egress_bps, memory_bytes, open_file_descriptors, task_count]
        probe_profile: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
        restart_profile: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
    PutNodeDesiredStateV1:
      type: object
      additionalProperties: false
      required: [command_id, reason_code, requested_valid_until, inventory_version, resource_envelope_version, resource_envelope_digest, sorted_processes]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        reason_code: {$ref: "#/components/schemas/DesiredReasonV1"}
        requested_valid_until: {type: string, format: date-time}
        inventory_version: {$ref: "#/components/schemas/PositiveInt64"}
        resource_envelope_version: {$ref: "#/components/schemas/PositiveInt64"}
        resource_envelope_digest: {$ref: "#/components/schemas/DigestHex32"}
        sorted_processes:
          type: array
          minItems: 0
          maxItems: 8
          uniqueItems: true
          x-talenro-order: slot_id_bytewise_ascending
          items: {$ref: "#/components/schemas/DesiredProcessV1"}
    SigningOperationV1:
      type: object
      additionalProperties: false
      required: [signing_id, status, reserved_generation]
      properties:
        signing_id: {$ref: "#/components/schemas/CanonicalUUID"}
        status: {$ref: "#/components/schemas/OperationResultV1"}
        reserved_generation: {$ref: "#/components/schemas/PositiveInt64"}
    RecoveryOperationV1:
      type: object
      additionalProperties: false
      required: [recovery_id, status]
      properties:
        recovery_id: {$ref: "#/components/schemas/CanonicalUUID"}
        status: {$ref: "#/components/schemas/OperationResultV1"}
    DrainNodeV1:
      type: object
      additionalProperties: false
      required: [command_id, reason_code]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        reason_code: {$ref: "#/components/schemas/OperatorReasonCodeV1"}
    DisableNodeV1:
      type: object
      additionalProperties: false
      required: [command_id, reason_code]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        reason_code: {$ref: "#/components/schemas/DisableReasonV1"}
    ReenrollNodeV1:
      type: object
      additionalProperties: false
      required: [command_id, recovery_id, csr_der_sha256, reason_code]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        recovery_id: {$ref: "#/components/schemas/CanonicalUUID"}
        csr_der_sha256: {$ref: "#/components/schemas/DigestHex32"}
        reason_code: {$ref: "#/components/schemas/OperatorReasonCodeV1"}
    HostRemediationEvidenceV1:
      type: object
      additionalProperties: false
      required: [evidence_id, completed_at, canonical_bytes, digest]
      properties:
        evidence_id: {$ref: "#/components/schemas/CanonicalUUID"}
        completed_at: {type: string, format: date-time}
        canonical_bytes: {type: string, minLength: 2, maxLength: 32768, pattern: '^[A-Za-z0-9_-]+$'}
        digest: {$ref: "#/components/schemas/DigestHex32"}
    CompleteReenrollmentV1:
      type: object
      additionalProperties: false
      required: [command_id, recovery_id, certificate_id, recovery_attestation_digest, host_remediation_evidence]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        recovery_id: {$ref: "#/components/schemas/CanonicalUUID"}
        certificate_id: {$ref: "#/components/schemas/CanonicalUUID"}
        recovery_attestation_digest: {$ref: "#/components/schemas/DigestHex32"}
        host_remediation_evidence: {$ref: "#/components/schemas/HostRemediationEvidenceV1"}
    RegisterHostSecurityIncidentV1:
      type: object
      additionalProperties: false
      required: [command_id, subtype, host_remediation_evidence]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        subtype: {$ref: "#/components/schemas/FaultSubtypeV1"}
        host_remediation_evidence: {$ref: "#/components/schemas/HostRemediationEvidenceV1"}
    ResourceEnvelopePackageV1:
      type: object
      additionalProperties: false
      required: [canonical_bytes, digest]
      properties:
        canonical_bytes: {type: string, minLength: 2, maxLength: 32768, pattern: '^[A-Za-z0-9_-]+$'}
        digest: {$ref: "#/components/schemas/DigestHex32"}
    RegisterResourceEnvelopeV1:
      type: object
      additionalProperties: false
      required: [command_id, envelope_package, host_remediation_evidence]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        envelope_package: {$ref: "#/components/schemas/ResourceEnvelopePackageV1"}
        host_remediation_evidence: {$ref: "#/components/schemas/HostRemediationEvidenceV1"}
    ResourceEnvelopeActivationV1:
      type: object
      additionalProperties: false
      required: [version, authority_sequence, digest]
      properties:
        version: {$ref: "#/components/schemas/PositiveInt64"}
        authority_sequence: {$ref: "#/components/schemas/PositiveInt64"}
        digest: {$ref: "#/components/schemas/DigestHex32"}
    ClearSecurityQuarantineV1:
      type: object
      additionalProperties: false
      required: [command_id, incident_id, host_remediation_evidence, recovery_snapshot_digest, recovery_attestation_digest]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        incident_id: {$ref: "#/components/schemas/CanonicalUUID"}
        host_remediation_evidence: {$ref: "#/components/schemas/HostRemediationEvidenceV1"}
        recovery_snapshot_digest: {$ref: "#/components/schemas/DigestHex32"}
        recovery_attestation_digest: {$ref: "#/components/schemas/DigestHex32"}
    ResumeAfterSecurityV1:
      type: object
      additionalProperties: false
      required: [command_id, recovery_id, target_operator_state, recovery_attestation_digest]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        recovery_id: {$ref: "#/components/schemas/CanonicalUUID"}
        target_operator_state: {$ref: "#/components/schemas/ResumeOperatorStateV1"}
        recovery_attestation_digest: {$ref: "#/components/schemas/DigestHex32"}
    ReauthorizeAfterRestoreV1:
      type: object
      additionalProperties: false
      required: [command_id, recovery_id, phase, target_operator_state, effect_digest, host_remediation_evidence]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        recovery_id: {$ref: "#/components/schemas/CanonicalUUID"}
        phase: {$ref: "#/components/schemas/RestorePhaseV1"}
        proposal_id: {$ref: "#/components/schemas/CanonicalUUID"}
        target_operator_state: {$ref: "#/components/schemas/RestoreTargetOperatorStateV1"}
        effect_digest: {$ref: "#/components/schemas/DigestHex32"}
        host_remediation_evidence: {$ref: "#/components/schemas/HostRemediationEvidenceV1"}
      oneOf:
        - properties:
            phase: {type: string, enum: [proposal]}
          not:
            required: [proposal_id]
        - required: [proposal_id]
          properties:
            phase: {type: string, enum: [approval]}
    RecoveryEnrollmentGrantV1:
      type: object
      additionalProperties: false
      required: [recovery_id, grant_id, csr_der_sha256, expires_at, status]
      properties:
        recovery_id: {$ref: "#/components/schemas/CanonicalUUID"}
        grant_id: {$ref: "#/components/schemas/CanonicalUUID"}
        csr_der_sha256: {$ref: "#/components/schemas/DigestHex32"}
        expires_at: {type: string, format: date-time}
        status: {$ref: "#/components/schemas/OperationResultV1"}
        enrollment_grant: {$ref: "#/components/schemas/Base64URL32"}
    RestoreReauthorizationV1:
      type: object
      additionalProperties: false
      required: [proposal_id, status, expires_at]
      properties:
        proposal_id: {$ref: "#/components/schemas/CanonicalUUID"}
        approval_id: {$ref: "#/components/schemas/CanonicalUUID"}
        status: {$ref: "#/components/schemas/OperationResultV1"}
        expires_at: {type: string, format: date-time}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 22
        maxLength: 86
        pattern: '^[A-Za-z0-9_-]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,18}"$'
    PageSize:
      name: page_size
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {$ref: "#/components/schemas/OperatorListCursorV1"}
    POPCodePath:
      name: pop_code
      in: path
      required: true
      schema: {$ref: "#/components/schemas/POPCodeV1"}
    FailureDomainIDPath:
      name: failure_domain_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/CanonicalUUID"}
    NodeIDPath:
      name: node_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/CanonicalUUID"}
    EndpointIDPath:
      name: endpoint_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/CanonicalUUID"}
    SlotIDPath:
      name: slot_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/SlotIDV1"}
    POPIsoCountryFilter:
      name: iso_country
      in: query
      required: false
      schema: {type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$'}
    POPRegionFilter:
      name: region
      in: query
      required: false
      schema: {$ref: "#/components/schemas/RegionV1"}
    NodePOPFilter:
      name: pop_code
      in: query
      required: false
      schema: {$ref: "#/components/schemas/POPCodeV1"}
    OperatorStateFilter:
      name: operator_state
      in: query
      required: false
      schema: {$ref: "#/components/schemas/OperatorStateV1"}
    SecurityStateFilter:
      name: security_state
      in: query
      required: false
      schema: {$ref: "#/components/schemas/SecurityStateV1"}
    IdentityStateFilter:
      name: identity_state
      in: query
      required: false
      schema: {$ref: "#/components/schemas/IdentityStateV1"}
    FailureDomainTypeFilter:
      name: domain_type
      in: query
      required: false
      schema: {$ref: "#/components/schemas/FailureDomainTypeV1"}
    FailureDomainStableIDFilter:
      name: stable_id
      in: query
      required: false
      schema: {$ref: "#/components/schemas/StableIDV1"}
    TransportFilter:
      name: transport
      in: query
      required: false
      schema: {$ref: "#/components/schemas/TransportV1"}
    ProtocolCapabilityFilter:
      name: protocol_capability
      in: query
      required: false
      schema: {$ref: "#/components/schemas/ProtocolCapabilityV1"}
    AdapterFilter:
      name: adapter
      in: query
      required: false
      schema: {$ref: "#/components/schemas/AdapterV1"}
    RequiredFilter:
      name: required
      in: query
      required: false
      schema: {type: boolean}
  headers:
    StrongETag:
      description: Strong resource generation validator
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,18}"$'
  responses:
    NodePOPCreated:
      description: Node POP created
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodePOPV1"}}}
    NodePOP:
      description: Node POP
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/NodePOPV1"}}}
    NodePOPList:
      description: Node POP page
      content: {application/json: {schema: {$ref: "#/components/schemas/NodePOPListV1"}}}
    FailureDomainCreated:
      description: Failure domain created
      headers: {ETag: {$ref: "#/components/headers/StrongETag"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/FailureDomainV1"}}}
    FailureDomain:
      description: Failure domain
