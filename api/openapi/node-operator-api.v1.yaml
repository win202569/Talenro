components:
  schemas:
    CanonicalUUID:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    DigestHex32:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Base64URL32:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
    PositiveInt64:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    NonNegativeInt64:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
    POPCodeV1:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
    RegionV1:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    StableIDV1:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
    SlotIDV1:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    CapacityProfileIDV1:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    OperatorReasonCodeV1:
      type: string
      enum: [provision, inventory_update, capacity_change, drain_maintenance, administrative_disable, retire, identity_compromise, host_remediation, security_recovery, authority_restore, release_update]
    DesiredReasonV1:
      type: string
      enum: [initial, operator_update, drain, resume, lease_refresh, clear_slot_quarantine, restore_reauthorize]
    FaultSubtypeV1:
      type: string
      enum: [identity_compromise, online_signer_equivocation, metadata_rollback, root_rollback, root_equivocation, unverified_client_highwater_conflict, client_highwater_ahead, server_trust_bundle_conflict, trusted_time_rollback_or_unavailable, local_state_corruption_or_rollback, release_or_process_integrity, profile_binding_mismatch, incident_overflow]
    ProtocolCapabilityV1:
      type: string
      enum: [fixture_loopback, xray_loopback, sing_box_loopback]
    AdapterV1:
      type: string
      enum: [fixture, xray, sing_box]
    OperatorStateV1:
      type: string
      enum: [provisioning, enabled, draining, disabled]
    SecurityStateV1:
      type: string
      enum: [normal, quarantined]
    IdentityStateV1:
      type: string
      enum: [never_enrolled, active, recovery_pending, recovery_limited, revoked]
    RestorePhaseV1:
      type: string
      enum: [proposal, approval]
    OperationResultV1:
      type: string
      enum: [pending, active, accepted, completed, superseded, rejected]
    FailureDomainTypeV1:
      type: string
      enum: [availability_zone, rack, power_domain, network_domain]
    TransportV1:
      type: string
      enum: [tcp, udp]
    ProcessLifecycleV1:
      type: string
      enum: [running, stopped, draining]
    DisableReasonV1:
      allOf:
        - $ref: "#/components/schemas/OperatorReasonCodeV1"
        - type: string
          enum: [administrative_disable, retire]
    ResumeOperatorStateV1:
      allOf:
        - $ref: "#/components/schemas/OperatorStateV1"
        - type: string
          enum: [enabled, draining, disabled]
    RestoreTargetOperatorStateV1:
      allOf:
        - $ref: "#/components/schemas/OperatorStateV1"
        - type: string
          enum: [enabled, draining]
    PublicErrorV1:
      type: object
      additionalProperties: false
      required: [code, request_id]
      properties:
        code:
          type: string
          enum: [invalid_request, unauthenticated, forbidden, not_found, conflict, rate_limited, dependency_unavailable, internal]
        request_id:
          type: string
          minLength: 16
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
        reason:
          type: string
          enum: [malformed, precondition_failed, stale_version, reenroll_required, incident_capacity_exceeded, authority_unavailable, credential_invalid, scope_changed, operation_in_progress, deadline_expired, unsupported_capability]
        retry_after_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
    NodePOPV1:
      type: object
      additionalProperties: false
      required: [pop_code, iso_country, region, operator_state, version, created_at, updated_at]
      properties:
        pop_code: {$ref: "#/components/schemas/POPCodeV1"}
        iso_country:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        region: {$ref: "#/components/schemas/RegionV1"}
        operator_state: {$ref: "#/components/schemas/OperatorStateV1"}
        version: {$ref: "#/components/schemas/PositiveInt64"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FailureDomainV1:
      type: object
      additionalProperties: false
      required: [failure_domain_id, domain_type, stable_id, version, created_at, updated_at]
      properties:
        failure_domain_id: {$ref: "#/components/schemas/CanonicalUUID"}
        domain_type: {$ref: "#/components/schemas/FailureDomainTypeV1"}
        stable_id: {$ref: "#/components/schemas/StableIDV1"}
        version: {$ref: "#/components/schemas/PositiveInt64"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NodeV1:
      type: object
      additionalProperties: false
      required: [node_id, pop_code, operator_state, security_state, identity_state, identity_epoch, inventory_version, security_version, created_at, updated_at]
      properties:
        node_id: {$ref: "#/components/schemas/CanonicalUUID"}
        pop_code: {$ref: "#/components/schemas/POPCodeV1"}
        operator_state: {$ref: "#/components/schemas/OperatorStateV1"}
        security_state: {$ref: "#/components/schemas/SecurityStateV1"}
        identity_state: {$ref: "#/components/schemas/IdentityStateV1"}
        identity_epoch: {$ref: "#/components/schemas/NonNegativeInt64"}
        inventory_version: {$ref: "#/components/schemas/PositiveInt64"}
        security_version: {$ref: "#/components/schemas/PositiveInt64"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        resume_operator_state:
          allOf: [{$ref: "#/components/schemas/OperatorStateV1"}]
          nullable: true
        pending_operator_transition:
          type: string
          enum: [draining, resume]
          nullable: true
        pending_transition_signing_id:
          allOf: [{$ref: "#/components/schemas/CanonicalUUID"}]
          nullable: true
        lineage_id:
          allOf: [{$ref: "#/components/schemas/CanonicalUUID"}]
          nullable: true
        resource_envelope_version:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
        resource_envelope_digest:
          allOf: [{$ref: "#/components/schemas/DigestHex32"}]
          nullable: true
        active_desired_generation:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
        next_desired_generation:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
        active_recovery_generation:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
        next_recovery_generation:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
        active_root_publish_id:
          allOf: [{$ref: "#/components/schemas/CanonicalUUID"}]
          nullable: true
        active_root_version:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
        active_metadata_publish_id:
          allOf: [{$ref: "#/components/schemas/CanonicalUUID"}]
          nullable: true
        active_metadata_version:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
        last_authority_operation_id:
          allOf: [{$ref: "#/components/schemas/CanonicalUUID"}]
          nullable: true
        last_authority_epoch:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
        last_authority_sequence:
          allOf: [{$ref: "#/components/schemas/PositiveInt64"}]
          nullable: true
      allOf:
        - oneOf:
            - required: [pending_operator_transition, pending_transition_signing_id]
            - not:
                anyOf:
                  - required: [pending_operator_transition]
                  - required: [pending_transition_signing_id]
        - oneOf:
            - required: [resource_envelope_version, resource_envelope_digest]
            - not:
                anyOf:
                  - required: [resource_envelope_version]
                  - required: [resource_envelope_digest]
        - oneOf:
            - required: [active_root_publish_id, active_root_version]
            - not:
                anyOf:
                  - required: [active_root_publish_id]
                  - required: [active_root_version]
        - oneOf:
            - required: [active_metadata_publish_id, active_metadata_version]
            - not:
                anyOf:
                  - required: [active_metadata_publish_id]
                  - required: [active_metadata_version]
        - oneOf:
            - required: [last_authority_operation_id, last_authority_epoch, last_authority_sequence]
            - not:
                anyOf:
                  - required: [last_authority_operation_id]
                  - required: [last_authority_epoch]
                  - required: [last_authority_sequence]
    NodeEndpointV1:
      type: object
      additionalProperties: false
      required: [endpoint_id, node_id, address, port, transport, protocol_capability, operator_state, inventory_version, created_at, updated_at]
      properties:
        endpoint_id: {$ref: "#/components/schemas/CanonicalUUID"}
        node_id: {$ref: "#/components/schemas/CanonicalUUID"}
        address:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[A-Za-z0-9][A-Za-z0-9.:-]*$'
        port: {type: integer, minimum: 1, maximum: 65535}
        transport: {$ref: "#/components/schemas/TransportV1"}
        protocol_capability: {$ref: "#/components/schemas/ProtocolCapabilityV1"}
        operator_state: {$ref: "#/components/schemas/OperatorStateV1"}
        inventory_version: {$ref: "#/components/schemas/PositiveInt64"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NodeProcessSlotV1:
      type: object
      additionalProperties: false
      required: [node_id, slot_id, adapter, capacity_profile_id, capacity_profile_version, required, operator_state, inventory_version, created_at, updated_at]
      properties:
        node_id: {$ref: "#/components/schemas/CanonicalUUID"}
        slot_id: {$ref: "#/components/schemas/SlotIDV1"}
        adapter: {$ref: "#/components/schemas/AdapterV1"}
        capacity_profile_id: {$ref: "#/components/schemas/CapacityProfileIDV1"}
        capacity_profile_version: {$ref: "#/components/schemas/PositiveInt64"}
        required: {type: boolean}
        operator_state: {$ref: "#/components/schemas/OperatorStateV1"}
        inventory_version: {$ref: "#/components/schemas/PositiveInt64"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OperatorListCursorV1:
      type: string
      minLength: 16
      maxLength: 2048
      pattern: '^[A-Za-z0-9_-]+$'
    NodePOPListV1:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 200
          items: {$ref: "#/components/schemas/NodePOPV1"}
        next_cursor: {$ref: "#/components/schemas/OperatorListCursorV1"}
    FailureDomainListV1:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 200
          items: {$ref: "#/components/schemas/FailureDomainV1"}
        next_cursor: {$ref: "#/components/schemas/OperatorListCursorV1"}
    NodeListV1:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 200
          items: {$ref: "#/components/schemas/NodeV1"}
        next_cursor: {$ref: "#/components/schemas/OperatorListCursorV1"}
    NodeEndpointListV1:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 200
          items: {$ref: "#/components/schemas/NodeEndpointV1"}
        next_cursor: {$ref: "#/components/schemas/OperatorListCursorV1"}
    NodeProcessSlotListV1:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 200
          items: {$ref: "#/components/schemas/NodeProcessSlotV1"}
        next_cursor: {$ref: "#/components/schemas/OperatorListCursorV1"}
    CreateNodePOPV1:
      type: object
      additionalProperties: false
      required: [command_id, pop_code, iso_country, region, operator_state, reason_code]
      properties:
        command_id: {$ref: "#/components/schemas/CanonicalUUID"}
        pop_code: {$ref: "#/components/schemas/POPCodeV1"}
        iso_country: {type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$'}
        region: {$ref: "#/components/schemas/RegionV1"}
        operator_state: {$ref: "#/components/schemas/OperatorStateV1"}
